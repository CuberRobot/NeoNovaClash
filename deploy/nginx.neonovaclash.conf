# NeoNovaClash 的 nginx 反向代理（含 WebSocket 升级头）
#
# 宝塔面板：保存为 /www/server/panel/vhost/nginx/neonovaclash.conf
# 普通环境：放到 sites-available 后做软链即可
#
# 生效：nginx -t && nginx -s reload
# 换成域名时，把 server_name 改成域名；用宝塔申请 Let's Encrypt 证书后，
# 面板会自动往这个 server 块里补 443 配置，前端会自动切到 wss://。

server {
    listen 80;
    server_name 189.24.77.139;

    access_log /www/wwwlogs/neonovaclash.log;
    error_log  /www/wwwlogs/neonovaclash.error.log;

    # 静态资源与 WebSocket 都走同一个后端
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 必需：没有这几行前端会停在「连接中…」
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
