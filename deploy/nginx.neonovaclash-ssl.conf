# NeoNovaClash 的 443 站点（Cloudflare Full (strict) 用）
#
# 什么时候用：
#   1) 公网能访问源站 443（云厂商安全组里放行 443）；
#   2) 已在宝塔里为该站点装上证书 —— 两条路线任选：
#      A. Cloudflare 源站证书（推荐，15 年有效）：
#         Cloudflare 后台 → SSL/TLS → Origin Server → Create Certificate，
#         主机名填 novaclash.cc, *.novaclash.cc，把证书与私钥分别保存为
#           /www/server/panel/vhost/cert/neonovaclash/fullchain.pem
#           /www/server/panel/vhost/cert/neonovaclash/privkey.pem
#      B. 宝塔面板 → 该站点 → SSL → Let's Encrypt（需要 80 可回源验证）
#
# 安装：
#   cp deploy/nginx.neonovaclash-ssl.conf /www/server/panel/vhost/nginx/neonovaclash-ssl.conf
#   nginx -t && nginx -s reload
#   （证书文件不存在时 nginx -t 会直接报错，所以先装证书再放这个文件）
#
# 装好之后回到 Cloudflare：SSL/TLS → Overview → 选 Full (strict)。

server {
    listen 443 ssl;
    http2 on;
    server_name novaclash.cc 189.24.77.139;

    ssl_certificate     /www/server/panel/vhost/cert/neonovaclash/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/neonovaclash/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    access_log /www/wwwlogs/neonovaclash.log;
    error_log  /www/wwwlogs/neonovaclash.error.log;

    include /www/server/panel/vhost/nginx/neonovaclash-cf-realip.inc;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 必需
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# www → 主域名（301，保留路径与查询参数）
server {
    listen 443 ssl;
    http2 on;
    server_name www.novaclash.cc;

    ssl_certificate     /www/server/panel/vhost/cert/neonovaclash/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/neonovaclash/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /www/wwwlogs/neonovaclash.log;
    error_log  /www/wwwlogs/neonovaclash.error.log;

    include /www/server/panel/vhost/nginx/neonovaclash-cf-realip.inc;

    return 301 https://novaclash.cc$request_uri;
}
